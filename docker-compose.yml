services:
  postgres:
    image: postgres:16-alpine
    container_name: idofitness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: idofitness
      POSTGRES_USER: idofitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - idofitness-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idofitness -d idofitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: idofitness-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://idofitness:${POSTGRES_PASSWORD:-changeme}@postgres:5432/idofitness
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      # Deliberately NOT "production" by default: Flask sets the session
      # cookie to Secure when FLASK_ENV=production, which browsers refuse
      # to send over plain http://<nas-ip>:3000. Flip this once you put
      # HTTPS in front of the app (Tailscale + reverse proxy, Fase 2).
      FLASK_ENV: ${FLASK_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: idofitness-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  idofitness-db-data:
