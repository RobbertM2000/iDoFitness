server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routes) — always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — "backend" is the docker-compose service name/DNS alias.
    # Cookies pass through untouched, which is what Flask-Login's session
    # cookie needs (frontend/src/api/client.js always calls fetch credentials:"include").
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Flask healthcheck, in case you want to hit it through the frontend proxy too
    location /healthz {
        proxy_pass http://backend:5000/healthz;
    }
}
